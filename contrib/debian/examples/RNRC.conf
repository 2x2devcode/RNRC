# RNRC.conf example — copy to your datadir as RNRC.conf
# (typically ~/.RNRC/RNRC.conf on Linux, or %APPDATA%\RNRC\RNRC.conf on Windows)

# Prefer these peers (explorer + known seeds). Default P2P port is 18355.
addnode=149.102.139.53:18355
addnode=185.249.199.205:18355
addnode=121.142.85.242:18355
addnode=82.37.112.143:18355

# Optional: also try as one-shot seed nodes
seednode=149.102.139.53:18355

# Explorer (HTTP): http://149.102.139.53:30301/

# --- Resource tuning (optional) ---
# Rotate blkNNNN.dat when a file reaches this size in bytes (default: 200 MiB).
# Existing oversized files are left as-is; new blocks go into the next file.
# maxblkfilesize=209715200

# Cap peer sockets (default: 40). Raise if you run a public seed.
# maxconnections=40

# LevelDB cache in MiB (default: 25). Lowering this only saves a little RAM;
# most memory use comes from the in-memory block index.
# dbcache=16

# Milliseconds between stake attempts when the wallet is unlocked (default: 2000).
# Higher = less CPU, slightly less stake aggressiveness.
# minersleep=2000

# Disable staking entirely if you only need to send/receive (lowest CPU).
# staking=0
